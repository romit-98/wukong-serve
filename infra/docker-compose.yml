version: "3.9"

# Shared infra: Redis (state), Prometheus (metrics), Grafana (dashboards).
# The Wukong-serve app itself runs on the host so iterating on code is fast.

services:
  redis:
    image: redis:7-alpine
    container_name: wukong-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: wukong-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    restart: unless-stopped
    extra_hosts:
      # Lets prometheus reach the app running on the docker host.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: wukong-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/wukong.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
